:root {
  --bg: #F3F5F7;
  --card: #FFFFFF;
  --fg: #0D1520;
  --muted: #47515E;
  --line: #CDD3DA;
  --accent: #A3171C;      /* 消防紅，只用在題號與目前主題 */
  --accent-ink: #FFFFFF;
  --chip: #E3E7EC;
  --hit: #FFE58A;
  --num: #0A4FA3;         /* 金額與數量 */
  --one-bg: #EAF0F6;
  --warn: #8A4B00;
  --warn-bg: #FFF3DC;
  --supp: #0B6B5C;        /* QA 以外的資料（KM、儀表板、統計報表） */
  --supp-bg: #E3F4EF;
  --adv: #5B3E96;         /* 答詢建議、時點提醒 */
  --adv-bg: #EFEAF8;
  --err: #9B1C1C;         /* 勘誤 */
  --err-bg: #FDE8E8;
  --font: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --scale: 1;
}

  :root:not([data-theme="light"]) {
    --bg: #0E1217; --card: #181E26; --fg: #F2F4F7; --muted: #B4BDC8; --line: #2E3843;
    --accent: #FF7A70; --accent-ink: #1A0606; --chip: #252E39; --hit: #6B5300;
    --num: #8EC5FF; --one-bg: #1F2A36; --warn: #FFC977; --warn-bg: #33270F; color-scheme: dark;
    --supp: #6FDCC3; --supp-bg: #11302A; --adv: #C6B2F5; --adv-bg: #271F3A; --err: #FF9C9C; --err-bg: #3A1717;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1217; --card: #181E26; --fg: #F2F4F7; --muted: #B4BDC8; --line: #2E3843;
  --accent: #FF7A70; --accent-ink: #1A0606; --chip: #252E39; --hit: #6B5300;
  --num: #8EC5FF; --one-bg: #1F2A36; --warn: #FFC977; --warn-bg: #33270F; color-scheme: dark;
  --supp: #6FDCC3; --supp-bg: #11302A; --adv: #C6B2F5; --adv-bg: #271F3A; --err: #FF9C9C; --err-bg: #3A1717;
}
html { font-size: calc(20px * var(--scale)); -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 1rem; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.row { display: flex; gap: 8px; align-items: center; }
.search { position: relative; flex: 1; min-width: 0; }
.search input {
  width: 100%; box-sizing: border-box; height: 3rem; font: inherit; font-size: 1.1rem; color: var(--fg);
  background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 0 2.6rem 0 0.8rem;
}
.search input:focus { outline: none; border-color: var(--accent); }
.search button {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 2.4rem; height: 2.4rem;
  border: 0; background: transparent; color: var(--muted); font-size: 1.4rem; border-radius: 8px;
}
.size { display: flex; gap: 6px; flex: none; }
.size button, .chip {
  font: inherit; color: var(--fg); background: var(--chip); border: 0; border-radius: 10px; cursor: pointer;
}
.size button { min-width: 2.8rem; height: 3rem; font-weight: 700; font-size: 1rem; }
button:focus-visible, .chip:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.ver { font-size: 0.8rem; color: var(--muted); }
.ver b { color: var(--fg); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 2.6rem; padding: 0 0.9rem; font-size: 0.9rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 48px; display: grid; gap: 12px; max-width: 46rem; margin: 0 auto;
}
.status { font-size: 0.9rem; color: var(--muted); }
.group-h { font-size: 0.85rem; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; margin-top: 10px; }

.q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.q summary { list-style: none; cursor: pointer; padding: 0.8rem 0.9rem; display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; align-items: baseline; min-height: 56px; box-sizing: border-box; }
.q summary::-webkit-details-marker { display: none; }
.qid { font-weight: 800; color: var(--accent); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.qt { font-weight: 700; font-size: 1.05rem; line-height: 1.45; min-width: 0; text-wrap: pretty; }
.ans { padding: 0 0.9rem 0.9rem; display: grid; gap: 0.7rem; }
.ans ol { margin: 0; padding: 0; list-style: none; counter-reset: p; display: grid; gap: 0.7rem; }
.ans li { counter-increment: p; display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.3rem; font-size: 1.15rem; line-height: 1.65; }
.ans li::before { content: counter(p) "."; font-weight: 800; color: var(--accent); }
.one { margin: 0; background: var(--one-bg); border-radius: 10px; padding: 0.6rem 0.75rem; font-size: 1.12rem; font-weight: 700; line-height: 1.6; }
.n { color: var(--num); font-weight: 800; white-space: nowrap; }
.fu { display: grid; gap: 0.4rem; }
.fu-h { font-size: 0.85rem; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; }
.fq { border: 1px solid var(--line); border-radius: 10px; }
.fq summary { list-style: none; cursor: pointer; padding: 0.6rem 0.75rem; min-height: 48px; box-sizing: border-box; display: grid; grid-template-columns: auto 1fr auto; gap: 0.5rem; align-items: baseline; font-size: 1.05rem; font-weight: 700; }
.fq summary::-webkit-details-marker { display: none; }
.fq summary::before { content: "問"; color: var(--accent); font-size: 0.85rem; }
.fq summary::after { content: "＋"; color: var(--muted); }
.fq[open] summary::after { content: "－"; }
.fq p { margin: 0; padding: 0 0.75rem 0.7rem; font-size: 1.08rem; line-height: 1.65; }
.note { margin: 0; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 0.55rem 0.75rem; font-size: 0.92rem; line-height: 1.55; }
.note b { font-weight: 800; }
.src { border-top: 1px solid var(--line); padding-top: 0.6rem; font-size: 0.85rem; color: var(--muted); display: grid; gap: 0.2rem; }
.src span { user-select: text; -webkit-user-select: text; }
mark { background: var(--hit); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 1rem; font-size: 1.05rem; }
.empty b { color: var(--accent); }
/* 必講：只能講一句時講這句 */
.must { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.5rem; align-items: baseline; font-size: 1.1rem; font-weight: 700; line-height: 1.55; }
.must b { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0.05rem 0.4rem; font-size: 0.8rem; }

/* QA 以外的內容：一律左側色條＋標籤，和 QA 內容分開 */
.x { margin: 0; border-left: 5px solid; border-radius: 10px; padding: 0.55rem 0.75rem; font-size: 1rem; line-height: 1.6; display: grid; gap: 0.25rem; }
.x.supp { background: var(--supp-bg); border-color: var(--supp); }
.x.adv { background: var(--adv-bg); border-color: var(--adv); }
.x.err { background: var(--err-bg); border-color: var(--err); }
.tag { justify-self: start; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.04em; border-radius: 5px; padding: 0.05rem 0.4rem; color: var(--card); }
.x.term { background: var(--one-bg); border-color: var(--muted); }
.term .tag { background: var(--muted); }
.supp .tag { background: var(--supp); } .adv .tag { background: var(--adv); } .err .tag { background: var(--err); }
.x .meta { font-size: 0.82rem; color: var(--muted); }
.rel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.ql { font: inherit; font-size: 0.85rem; font-weight: 800; color: var(--accent); background: var(--chip); border: 0; border-radius: 8px; min-height: 2.2rem; min-width: 3rem; padding: 0 0.5rem; cursor: pointer; }

/* 先讀頁 */
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem; display: grid; gap: 0.7rem; }
.sec h2 { margin: 0; font-size: 1.15rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.sec h2 .tag { font-size: 0.72rem; }
.sec.supp h2 .tag { background: var(--supp); } .sec.qa h2 .tag { background: var(--muted); }
.sec.supp { border-left: 5px solid var(--supp); }
.lead { margin: 0; font-size: 0.9rem; color: var(--muted); line-height: 1.55; }
.ax { display: grid; gap: 0.35rem; padding-top: 0.6rem; border-top: 1px solid var(--line); }
.ax:first-of-type { border-top: 0; padding-top: 0; }
.ax h3 { margin: 0; font-size: 1.08rem; }
.ax p { margin: 0; font-size: 1.05rem; line-height: 1.6; }
.ax .tip { font-size: 0.9rem; color: var(--warn); }
.kv { display: grid; gap: 0.15rem; padding-top: 0.55rem; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: 0; padding-top: 0; }
.kv .k { font-weight: 800; font-size: 1rem; }
.kv .v { font-size: 1.05rem; line-height: 1.55; }
.kv .meta { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
.sec details summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.ver-box { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }
.ver-box b { color: var(--fg); }
.back { justify-self: start; }
.who { display: grid; gap: 0.5rem; }
.who-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0.5rem 0; border-top: 1px solid var(--line); }
.who-row:first-child { border-top: 0; }
.who-row b { min-width: 5rem; font-size: 1.05rem; }
@media (prefers-reduced-motion: no-preference) { .q[open] .ans { animation: in .15s ease-out; } @keyframes in { from { opacity: .4 } } }

<script>
const DATA = {"meta": {"updated": "115-10-20（2026-10-20）", "received": "2026-10-28", "session": "第11屆第6會期"}, "groups": ["水域救援", "山域救援", "化災・核災・新能源", "無人機・機器人・科技救災", "裝備・車輛", "消防三權・救災安全・事故調查", "勤務・人力・回歸專業", "緊急救護・醫療整備", "預算・宣導"], "items": [{"id": "Q01", "title": "針對台灣沒有專門激流救援隊這個問題，消防署要如何加強消防員在激流救援的能力，有何因應對策，以及平時是如何訓練的?", "group": "水域救援", "kw": "激流救援, 水域, 濁水溪, 急流救生, 事故安全官, 三層安全", "one": "不另設專責激流隊，改以「中央培育種子、地方擴大訓練」把急流救援能力普及到第一線，並把安全機制制度化。", "pts": ["訓練：引進美國 NFPA 1006 急流救生教官，培訓種子教官，辦 IRB（動力橡皮艇）與急流救援進階訓練。", "安全：落實「主要救援、下游戒護、岸際支援」三層防線，並依消防法落實風險評估與退避權。", "人力：擴大警大、消防特考招生補足員額；輔導縣市優化梯次派遣與區域聯防，建立跨隊支援 SOP。", "減輕非本業負擔：捕蜂捉蛇回歸農政、水源查察與安檢簡化數位化，讓同仁專注救災、救護與訓練。"], "fu": [["NFPA 1006 是什麼？", "美國防火協會（NFPA）的急流救生相關標準；本署邀請依此標準授課的急流救生教官來臺，檢討國內水域案件、精進船艇運用與現場安全，114.12.7–13 並辦急流救援總教官複訓。"], ["三層安全防線怎麼運作？", "主船執行救援，另配置備援船艇在下游戒護，岸邊再設安全支援；訓練時讓學員實際輪流擔任各安全角色。"], ["事故安全官訓練教什麼？", "指揮體系與幕僚概念、安全官職責、風險判讀與管理、通訊安全與綜合演練，並邀美國國家消防學院資深教官授課。"]], "note": "", "updated": "115-10-20", "contact": "蕭專員清憶", "must": "三層安全防線：主要救援、下游戒護、岸際支援"}, {"id": "Q08", "title": "水域活動安全有何管理機制？本署的權責事項與作為？", "group": "水域救援", "kw": "水域活動, 防溺, 水域管理, 權責, 溺水", "one": "水域活動由各管理機關管理，消防負責救溺與救援能力提升，並配合宣導。", "pts": ["管理權責：風景特定區、國家公園由該管理機關；其餘由縣市政府，依「水域遊憩活動管理辦法」管理。", "中央分工依教育部 114.8.18「中央單位水域安全維護工作分工表」，涉及運動部、教育部、交通部、海巡署等 9 個機關。", "本署權責：救溺救護、加強救援訓練、協請民間救難團體警戒，並函發高風險水域演練計畫。", "溺水人數 114 年 1,056 人、死亡 631 人，較前幾年增加。"], "fu": [["民眾違規有罰則嗎？", "管理機關可依發展觀光條例第60條處罰：非營利 1萬至5萬元、營利 5萬至20萬元，並禁止活動。"], ["高風險水域演練計畫是什麼？", "本署 114.9.9 函發，請各消防機關盤點轄內高風險水域，擇點演練精進搶救作為。"], ["宣導做了什麼？", "防救災訊息平臺電視跑馬燈與廣播、臉書事前主動宣導、113 年建置「民眾水域活動資訊服務網頁」。"]], "note": "", "updated": "115-10-20", "contact": "蕭專員清憶", "must": "114 年溺水 1,056 人、死亡 631 人"}, {"id": "Q43", "title": "水域活動安全有何管理機制？本部消防署的權責事項與作為？（時事）", "group": "水域救援", "kw": "水域活動, 防溺, 水域管理, 權責, 時事", "one": "水域活動由各管理機關管理，消防負責救溺與救援能力提升，並配合宣導。", "pts": ["管理權責：風景特定區、國家公園由該管理機關；其餘由縣市政府。", "中央依教育部 114.8.18 分工表，涉及運動部、教育部、交通部、海巡署等 9 個機關。", "本署權責：救溺救護、加強救援訓練、協請民間救難團體警戒。", "溺水人數 114 年 1,056 人、死亡 631 人。"], "fu": [["民眾違規有罰則嗎？", "依發展觀光條例第60條：非營利 1萬至5萬元、營利 5萬至20萬元。"], ["宣導頻率？", "5 至 9 月電視跑馬燈與廣播至少 2 次，7、8 月暑假每週 4 次。"]], "note": "與 Q08 幾乎相同，只多「（時事）」與宣導頻率。", "updated": "115-10-20", "contact": "蕭專員清憶", "must": "114 年溺水 1,056 人、死亡 631 人"}, {"id": "Q51", "title": "115.8.31南投縣濁水溪水域救援任務搜救同仁1殉職之處置情形？策進作為？", "group": "水域救援", "kw": "濁水溪, 南投, 殉職, 泛舟, 巴庫拉斯, 伍程嶸, IRB", "one": "已啟動中央與地方調查會、心理諮商與撫卹，並從人力、訓練、安全機制與退避權全面檢討。", "pts": ["115.8.31 南投信義分隊救援泛舟受困民眾，IRB 逆攻時翻覆，伍程嶸同仁殉職，追晉分隊長。", "人力：108 年至 115 年 1 月已增補 5,118 人；警專招生擴至 400 名，特考每年 1,000 名。", "訓練：急流教官由 188 人增至 253 人；急流證照 8,156 人，取照率 47.9%。", "安全：三層防線、強化退避權，並將修訂水域救生注意事項。"], "fu": [["事故經過？", "8.30 有 5 人泛舟翻艇、3 人受困；8.31 救援時 IRB 遭急流沖翻，1 人未能攔截，15:00 尋獲時已無生命徵象，17:08 宣告不治。9.2 再出動空勤直升機完成受困民眾救援。"], ["撫卹怎麼處理？", "依公務人員退撫法辦理，並依警察人員人事條例從優加發撫卹金、慰問金與子女教養，協助褒揚令、追晉與入祀忠烈祠。"], ["服勤時數改善了嗎？", "115 年 6 月全國平均總服勤 233 小時、超勤 88 小時，已提早達成 116 年標準。"]], "note": "", "updated": "115-10-20", "contact": "蕭專員清憶", "must": "急流教官由 188 人增至 253 人；急流證照 8,156 人"}, {"id": "Q14", "title": "執行強化山域意外事故救援機制及民力運用作為？(羅美玲委員)", "group": "山域救援", "kw": "山域, 山難, 民力, 民間協勤, 共同供應契約, 羅美玲", "one": "115 年起由本署統一辦理民間協勤共同供應契約，各縣市可跨轄即時動用民間專業人力。", "pts": ["山域救援地形複雜、天候多變、搜救時間長，單一機關難以因應，須整合民間專業。", "115 年「山域救援專業諮詢及協勤」共同供應契約預算 360萬元，執行至 115.12.15。", "複數決標，本署及各縣市可向任一立約廠商下訂，且可跨行政區調度。", "服務含技術支援、運補背負、現場協助搜索、專業諮詢、傷員或遺體背負。"], "fu": [["怎麼控管品質？", "以動用通知書（急迫可先電話後補書面）動用，現場由指揮官管控，事後驗收付款。"], ["長期目標？", "從「臨時找人、被動應變」轉為「事前整備、精準派遣、跨域協作」，並累積數據滾動修正。"]], "note": "", "updated": "115-10-20", "contact": "陳專員文祥", "must": "115 年共同供應契約 360萬元，各縣市可跨轄調度民間專業人力"}, {"id": "Q21", "title": "提升山域意外事故救援機制中程計畫執行情形。（時事）", "group": "山域救援", "kw": "山域中程計畫, 執行情形, 浮濫求援, 山林開放", "one": "山林開放後，以中程計畫解決「難找、難到、難救」，並以處理措施遏止浮濫求援。", "pts": ["行政院 112.4.27 核定「提升山域事故救援效能 5 年中程計畫」（113–117 年），總經費 7億4,961萬9,000元。", "本署辦 9 項工作（協力團隊、定位設備租賃、留守平臺、搜救資訊系統等）；補助 13 縣市訓練、裝備、定位設備。", "110.5.6 函頒浮濫求援處理措施：公開事故資訊、加強宣導，並鼓勵地方在自治條例訂定浮濫求援罰則。"], "fu": [["浮濫求援處理措施具體做什麼？", "公開山域事故資訊並結合各平臺宣導，改善民眾求援自律；請教育與山域管理機關改善登山安全與設施；已訂自治條例的縣市研訂罰則，例如調整管制山域範圍、增訂輕忽或浮濫求援裁罰要件、設審核小組。"], ["山難由誰指揮？", "中央災害防救委員會 104.4.23 第 25 次會議決議：山域主管機關處長任行政協調總指揮，消防到場後由消防主管擔任人命救助指揮官。"], ["近期還有什麼？", "115 年 9、10 月到 13 縣市辦搜救資訊系統訓練，12 月預計赴紐西蘭研習跨機關搜救指揮體系。"]], "note": "", "updated": "115-10-20", "contact": "陳專員文祥", "must": "中程計畫 113–117 年、總經費 7億4,961萬9,000元"}, {"id": "Q22", "title": "鑑於近年山域事故呈增加之勢且為數頗鉅，允宜針對事故態樣及遇難高風險族群妥為宣導防範重點，俾降低事故發生？(時事)", "group": "山域救援", "kw": "山域宣導, 高風險族群, 登山留守, 衛星定位, 中高齡", "one": "針對迷路與中高齡兩大高風險，以定位設備租賃、留守平臺與事故分析引導民眾登山自律。", "pts": ["補助民間維運登山留守平臺，並在事故熱點試辦優惠或免費租借 Garmin inReach 等定位設備。", "以田野調查做事故質性分析，找出事故根本原因，提供教育與山域管理機關改善。", "建置新一代山域救援管理平臺，結合留守平臺民眾端資訊。", "110.5.6 函頒浮濫求援處理措施，公開事故資訊並加強宣導。"], "fu": [["留守平臺是什麼？", "由民間協會維運，提供定位設備租借與人工留守（如 Line@），以 Garmin 後臺掌握登山軌跡；115 年兩協會共執行留守 2,068 次（431＋1,637 次）。"], ["為什麼強調中高齡？", "計畫目標就是降低迷路與中高齡山難機率。"]], "note": "", "updated": "115-10-20", "contact": "陳專員文祥", "must": "115 年兩協會共執行登山留守 2,068 次"}, {"id": "Q32", "title": "有關社群媒體人士及新聞報導質疑本署「提升山域事故救援效能 5 年中程計畫」執行公正性，本署立場為何？", "group": "山域救援", "kw": "山域計畫公正性, 收編, 教官, 社群爭議, 蔡日興", "one": "計畫全程依採購法公開辦理，沒有特定人把持或圖利。", "pts": ["行政事務由國立臺北科技大學公開招標得標（113 年）。", "留守平臺與定位設備租借經公開評核，由臺灣愛陌生安全推廣協會、台灣登山教育推展協會辦理。", "115 年民間協勤改由本署辦共同供應契約，4 月 7 日公開評選出 11 家民間搜救團隊。", "經費專用於提升各縣市搜救量能，秉持公平公開。"], "fu": [["有排除特定民間團體嗎？", "沒有。3 月請各消防機關轉知民間團體（含自然人）投標，公開評選，範圍涵蓋全國。"]], "note": "", "updated": "115-10-20", "contact": "陳專員文祥", "must": "全程公開招標、公開評選，115 年評選出 11 家民間搜救團隊"}, {"id": "Q33", "title": "「提升山域事故救援效能 5 年中程計畫」執行進度、執行成效及歷年補助情形為何？", "group": "山域救援", "kw": "山域計畫執行進度, 成效, 補助, 留守, inReach", "one": "計畫 113–117 年、7億4,962萬元，115 年山域事故件數與死亡人數都明顯下降。", "pts": ["本署自辦 9 項 2億23萬5,000元（27%）；補助 13 縣市 5億4,938萬5,000元（73%）。", "115 年截至 9 月事故 284 件，較 114 年 486 件減少 41.56%。", "發生人數 381 人（減 42.36%），死亡 23 人（減 20.69%）。", "補助地方：113 年 4,421萬9,000元、114 年 5,782萬6,000元。"], "fu": [["定位設備租借成效？", "愛陌生協會 30 具 inReach、出租 2,524 天、留守 431 次；登山教育協會 15 具 inReach、46 具 PLB、出租 1,931 天、留守 1,637 次。"], ["搜救資訊系統進度？", "跨平臺搜救資訊管理系統完成約 81.2%，已有 3D 圖臺與地形套疊，正優化 AI 分析與離線搜救功能。"], ["培訓了多少人？", "山域救援師資班 2 梯次、64 人；另辦 3 場全國研討會與 2 場跨機關演練。"]], "note": "比較基準不同：115 年只算到 9 月，114 年是全年，被追問時要說明。", "updated": "115-10-20", "contact": "陳專員文祥", "must": "115 年截至 9 月山域事故 284 件，較 114 年減少 41.56%"}, {"id": "Q46", "title": "山域中程計畫津貼發給實際參與搜救人員後續辦理情形以及高雄茂林紅塵峽谷救援案件後續辦理情形？(伍麗華委員)", "group": "山域救援", "kw": "山域津貼, 民間人力, 茂林, 紅塵峽谷, 伍麗華, 原住民", "one": "已建立優先聘用原鄉部落人士的機制，並請縣市對實際協助的族人給予獎勵或補償。", "pts": ["中程計畫每年約 360萬元補助 13 縣市聘用民間專業協勤，優先聘用原鄉部落人士。", "113 年 11 個團體含原住民 52 人；114 年 19 個團體含原住民 53 人。", "114.6.9 函請縣市依災防法、消防法與獎勵金要點，對協助族人表揚、補償或發獎勵金。", "茂林案：高雄市消防局表揚 13 位族人，並補助深入現場的吉普車 2 輛共 1萬元。"], "fu": [["115 年動用情形？", "截至 9 月共 13 案、29萬6,400元（臺中、高雄、苗栗、南投）。"], ["後續還會做什麼？", "修正協勤契約範例，研議納入原住民與原住民特搜隊支援時的津貼。"]], "note": "", "updated": "115-10-20", "contact": "陳專員文祥", "must": "協勤原住民 113 年 52 人、114 年 53 人"}, {"id": "Q02", "title": "是否將特定工廠列入搶救困難地區?", "group": "化災・核災・新能源", "kw": "特定工廠, 特登工廠, 搶救困難地區, 消防水源, 農地工廠", "one": "特定工廠須先改善消防水源才能合法營運，改善後搶救條件與一般工廠相同，因此不另列搶救困難地區。", "pts": ["特定工廠依「特定工廠登記辦法」納管，未納管不得繼續使用。", "須符合消防安全設備設置標準與公共危險物品場所標準，並依外部水源檢核表改善消防水源。", "改善完成後搶救與一般工廠無異；本署持續配合經濟部推動水源改善。"], "fu": [["這議題怎麼來的？", "消促會主張特定工廠多在救災不易地區；112.4.18 洪申翰委員辦公室討論會決議，請經濟部與本署研議將納管、未納管工廠與搶救困難地區圖資套疊並公開。"], ["法源依據？", "工廠管理輔導法第28條之7授權的特定工廠登記辦法第15條：消防安全須符合相關標準，並改善消防水源。"]], "note": "", "updated": "115-10-20", "contact": "吳科員東穎", "must": "改善消防水源後，搶救條件與一般工廠無異"}, {"id": "Q04", "title": "我國地震引發複合性災害之核災部分消防單位如何應變？", "group": "化災・核災・新能源", "kw": "核災, 核電廠, 複合性災害, 地震, 輻射", "one": "核電廠內由電廠指揮、消防支援；廠外由消防先到場，在核安會專家評估安全後進行人命救助。", "pts": ["廠內：依台電與新北、屏東消防局支援協定，警衛室內圍由電廠統一指揮；外圍廠區由地方消防局指揮。", "支援人員由電廠引導，電廠提供輻射防護裝備與臨時劑量佩章，並做輻射安全管制。", "廠外：派受核生化訓練人員與偵測裝備到場，通報核安會派專家；確認安全後配合核安會決策救人。"], "fu": [["必要時誰支援？", "可依「國軍協助災害防救辦法」申請國軍核生化部隊支援；災情擴大成立中央災害應變中心後由其統籌。"], ["廠外處置依什麼原則？", "依本署 115.3.25 修正的危害性化學品災害搶救指導原則：危害辨識、行動方案、區域管制、建立管理系統、請求支援、善後處理。"]], "note": "", "updated": "115-10-20", "contact": "謝技士承翰", "must": "廠內電廠指揮、廠外消防先到，核安會評估安全後救人"}, {"id": "Q05", "title": "就目前全國化災搶救車輛、裝備器材及訓練是否足以因應各類危害物質事故搶救任務？", "group": "化災・核災・新能源", "kw": "化災, 化學車, 危害物質, 化災裝備, 化災訓練, H-Card", "one": "各縣市已依地區特性整備化災車輛、裝備與訓練，並有環境部專業團隊支援；114 年起再以化學韌性計畫補強。", "pts": ["全國化學消防車 221 輛、化學災害處理車 25 輛；114 年再補助通訊指揮車 11 輛、核生化與化災處理車 4 輛。", "114 年化學韌性計畫購置數位式空氣呼吸器 910 組、熱顯像儀 174 個、RIT 救援包 146 組等。", "化災搶救訓練累計 535 班次、2 萬 3,317 人次（85 年至 115 年 3 月）。", "環境部毒災應變諮詢中心＋13 個環境事故專業技術小組，提供現場諮詢與支援。"], "fu": [["H-Card 是什麼？", "危害辨識卡：本署 110 年訂定製作基準，引導業者自行標示廠區化學品的救災風險，災時讓消防快速掌握。"], ["工廠不給資訊怎麼辦？", "消防法第21條之1要求管理權人提供化學品種類、數量、位置圖，並派專人到場協助，違者可處罰。"], ["敬鵬大火後改了什麼？", "115.3.25 修正危害性化學品災害搶救指導原則，強化「危害辨識」與「行動方案」中的救災安全規定。"]], "note": "Q20 同一諮詢體系寫「10 個」環境事故專業技術小組，與本題的 13 個不一致。", "updated": "115-10-20", "contact": "謝技士承翰", "must": "化學消防車 221 輛＋化學災害處理車 25 輛；化災訓練 2萬3,317 人次"}, {"id": "Q17", "title": "消防員救災時除由工廠管理權人提供資訊外，是否有其他管道？化學雲系統內的資訊呈現與詳盡程度，是否足夠供消防員救災所需？", "group": "化災・核災・新能源", "kw": "化學雲, 工廠資訊, 119派遣系統, 圖資, GHS", "one": "除了業者提供，119 派遣系統已介接環境部化學雲等圖資，出勤時即可調閱。", "pts": ["119 派遣系統已介接消防水源、竣工圖說、公危場所配置圖與化學雲毒化物場所資料。", "化學雲快報首頁新增 GHS 危害圖示（紅黃藍分級）與工廠平面圖，112.12.26 完成。", "研議儲存化學品場所在派遣系統與行動 APP 主動示警，提醒指揮官勿貿然進入。", "建議經濟部在危險物品申報平面圖加入救災資訊，先在園區試辦。"], "fu": [["GHS 圖示有什麼用？", "化學雲快報首頁的化學品危害圖示，以紅、黃、藍底色區分危害程度，消防人員到場前即可判斷，並可快速下載工廠平面圖。"], ["跨部會怎麼處理？", "行政院 112.10.3 召開工廠化學品安全管理精進會議，請經濟部負責勾稽業者是否如實申報危險物品。"]], "note": "", "updated": "115-10-20", "contact": "謝技士承翰", "must": "119 派遣系統已介接環境部化學雲，出勤即可調閱"}, {"id": "Q20", "title": "化學災害搶救精進作為及補助地方縣市採購化學災害搶救裝備補助情形。", "group": "化災・核災・新能源", "kw": "化災補助, 化災裝備, 化學韌性計畫, 建構安全化學環境", "one": "化災裝備靠兩期中程計畫接續補助，前期 4億8,000萬元已執行完，114 年起接續化學韌性計畫。", "pts": ["全國化學消防車 221 輛、化學災害處理車 25 輛。", "建構安全化學環境計畫（109–113 年）中央 4億8,000萬元，補助地方 3億5,875萬元。", "補助遙控砲塔、數位式空氣呼吸器、救災機器人、熱顯像無人機等。", "114 年起「建構國家安全化學與韌性永續計畫」（114–118 年）接續補助。"], "fu": [["各年補了多少？", "109 年 3,170萬元、110 年 4,427萬7,000元、111 年 1億4,678萬7,000元、112 年 1億1,377萬3,000元、113 年 1,933萬8,000元。"]], "note": "本題訓練數據為 85–111 年 449 班次、1萬9,795 人次，較 Q05（535 班次、2萬3,317 人次）舊；環境事故技術小組寫 10 個，Q05 寫 13 個。", "updated": "115-10-20", "contact": "郭視察哲男", "must": "前期 4億8,000萬元已執行完，114 年起化學韌性計畫接續"}, {"id": "Q26", "title": "「建構國家安全化學與韌性永續計畫」，維護消防設備性能及加強防救災相關訓練之作法？", "group": "化災・核災・新能源", "kw": "化學韌性計畫, 保養維護, 化災訓練, 化學雲", "one": "計畫以智慧消防、科技救災、保護同仁為目標，並以保養計畫、評核與抽檢確保裝備堪用。", "pts": ["總經費 41億3,210萬元，中央 25億5,907萬7,000元、地方 15億7,302萬3,000元。", "受補助機關核銷時須提保養維護計畫並自編經費；本署抽檢，並納入年度自主評核與不定期訪查。", "化災訓練：地方辦基礎班，本署辦進階、指揮官與教官複訓；外勤人員須於 113 年底前完成化學雲操作訓練。"], "fu": [["計畫主要做什麼？", "優化特殊災害訓練設施、編國際化教材、建置 AI 輔助 119 派遣系統、補助地方救災裝備。"]], "note": "Q35 寫計畫滾動修正後總經費為 39億576萬5,000元；本題仍用原核定 41億3,210萬元。", "updated": "115-10-20", "contact": "郭視察哲男、謝技士承翰", "must": "核銷須提保養計畫，本署抽檢並納入自主評核"}, {"id": "Q35", "title": "建構國家安全化學與韌性永續計畫成果說明及115年推動項目？", "group": "化災・核災・新能源", "kw": "化學韌性計畫成果, 115年推動, AI派遣", "one": "114 年已補助各類車輛與科技裝備，115 年重點是 AI 輔助 119 派遣與化災決策系統。", "pts": ["114–118 年，滾動修正後 39億576萬5,000元；本署 23億3,202萬2,000元、地方 15億7,374萬3,000元。", "114 年補助救災指揮車 11 輛、空氣呼吸器 910 組、熱顯像儀 174 臺、救災機器人 5 臺等；訓練 293 人。", "115 年總經費 7億1,545萬7,000元；AI 派遣與化災決策系統 8,857萬1,000元。", "115 年補助地方裝備 1億6,485萬7,000元、地方 AI 派遣系統 6,215萬1,000元。"], "fu": [["AI 派遣系統會多什麼功能？", "納入手機 APP 報案、定位與聽語障報案管道，並介接救災資料庫供幕僚快速查詢。"], ["核定時間？", "行政院 113.1.10 核定，114.7.7 核定變更。"]], "note": "", "updated": "115-10-20", "contact": "郭視察哲男", "must": "115 年 AI 派遣與化災決策系統 8,857萬1,000元"}, {"id": "Q13", "title": "地下室電動車起火預防及搶救因應策略為何？", "group": "化災・核災・新能源", "kw": "電動車, 地下室, 停車場, 鋰電池火災", "one": "以「預防＋自動滅火」為主，消防到場依國際建議大量用水降溫，必要時拖到地面處理。", "pts": ["電動車與電池須符合國家標準，共 64 種相關國家標準。", "充電設備依電業法由合格承裝業施工，並依本署「建築物附屬停車空間電動車輛充電使用安全指引」。", "室內停車空間應設水霧、泡沫等自動滅火設備；修法增訂撒水設備與撒水密度，已送法規會審查。", "搶救依 NFPA 與車廠建議：大量用水隔離降溫，降溫後拖到地面持續撒水。"], "fu": [["為什麼地下室難救？", "通風差、能見度差、救援困難，且電池熱失控不易完全撲滅。"], ["撒水修法參考什麼？", "參考美國 NFPA 13 自動撒水設備安裝標準，增訂停車空間有效撒水密度。"]], "note": "", "updated": "115-10-20", "contact": "余專員家均", "must": "預防＋自動滅火為主；停車空間撒水修法已送法規會"}, {"id": "Q28", "title": "鋰電池及儲能設施消防安全管理及搶救應變措施為何？", "group": "化災・核災・新能源", "kw": "鋰電池, 儲能, 儲能櫃, 綠能, 熱失控", "one": "鋰電池與儲能火災難以完全撲滅，採防守策略持續降溫；源頭由經濟部驗證與本部指引管理。", "pts": ["鋰電池須通過標準檢驗局檢驗；儲能案場依經濟部驗證技術規範與本部「提升儲能系統消防安全管理指引」。", "熱失控會產生易燃氣體、易復燃，水只能降溫，須等化學反應結束。", "搶救採防守策略：建立通風、大量用水持續降溫，在可控下讓其燃盡。", "訓練中心建置綠電、科技廠、電動車事故訓練設施，並爭取 NFPA 國際認證。"], "fu": [["有實際案例嗎？", "114.1.6 載運 3,200 顆鋰電池的儲能櫃貨櫃車在國道 1 號虎尾交流道翻覆起火，雲林消防大量射水約 10 小時才熄滅。"], ["熱失控是什麼？", "電池受熱開始自加熱，產熱快過散熱就連鎖升溫，可能起火爆炸。"]], "note": "", "updated": "115-10-20", "contact": "蕭專員清憶", "must": "防守策略：持續降溫，在可控下讓其燃盡"}, {"id": "Q49", "title": "張智倫委員：麥寮風機火災，目前消防署是否有主動研議搶救SOP或已有相關因應對策？", "group": "化災・核災・新能源", "kw": "風機, 風力發電, 麥寮, 張智倫, GWO, NFPA 850", "one": "已有因應原則：依國際作法採防守，周界管制、防飛火、不讓消防上高空；關鍵在業者事前預防與自主救援。", "pts": ["風機高 60–80 公尺、多在濱海空曠處，雲梯車難接近；無人受困時以警戒管制、防碎片掉落為主。", "有人受困時，由營運單位、製造商與專業高空救援人員共同評估，消防負責地面指揮、管制與醫療整備。", "麥寮案（114.5.31）：12:38 獲報，16:32 撲滅風機下方火勢，交台電處理。", "建議業者在機艙加裝自動滅火、溫度與火災偵測，並即時通報。"], "fu": [["GWO 是什麼？", "全球風能組織，訂有國際風電產業實務與高空救援作業原則；依其原則，機艙受困救援主要靠風機內建逃生系統、維修人員自救設備與專業高空繩索救援團隊。"], ["國際標準怎麼說？", "NFPA 850 第 13 章：採防禦型戰術，消防人員不進入高風險高空環境，以周界管制與安全距離警戒為主，必要時讓火勢受控燃燒。"], ["為什麼不爬上去救？", "塔內梯子狹窄、火星落下，著裝爬 60 公尺以上負荷大；斷電後葉片轉動仍會發電，有觸電風險。"], ["風機要不要設消防設備？", "風機不屬消防法所稱場所，無設置標準適用；台電機艙設有滅火器與火災感知器，回傳後通報消防。"]], "note": "", "updated": "115-10-20", "contact": "蕭專員清憶、顏視察宏霖", "must": "風機 60–80 公尺，消防不上高空，以周界管制為主"}, {"id": "Q10", "title": "遙控無人機業務推動情形。", "group": "無人機・機器人・科技救災", "kw": "無人機, 操作證, 無人機訓練, 無人機補助", "one": "消防無人機已有 420 架、全為非大陸產品，118 年目標每分隊 1 組。", "pts": ["現有 420 架；高級操作證 522 人、基本級 678 人（115.1.9 調查）。", "經濟部無人載具產業計畫（115–118 年）補助 241 組、3億6,150萬元，114.10.30 核定。", "化學韌性計畫補助 72 架；高科技廠房計畫補助 38 架、3,800萬元；救災志工計畫 10 架。", "114.12 辦 2 梯次火場、水域、山域應用訓練，共 51 人。"], "fu": [["義消也有嗎？", "「強化各類型義消科技化訓練與精進裝備中程計畫」（113–118 年）將協助各縣市成立義消無人機隊。"], ["未來目標？", "118 年達成 1 消防分隊 1 無人機組。"]], "note": "", "updated": "115-10-20", "contact": "吳科員東穎", "must": "現有 420 架，118 年每分隊 1 組"}, {"id": "Q12", "title": "消防機關採購無人機有何困難處？", "group": "無人機・機器人・科技救災", "kw": "無人機採購, 資安認證, 共同供應契約, TTC", "one": "困難在通過資安認證的機型太少；中央以提供名單、協調廠商、共同供應契約與全額補助協助。", "pts": ["政府須採購通過資安認證機型，但通過的廠商與型號少。", "每月向電信技術中心（TTC）取得通過檢測名單，提供各縣市參考；並鼓勵國內廠商送驗。", "已向民航局反映，建議評估資安檢測是否有放寬空間。", "工程會推「無人機共同供應契約」（臺灣銀行訂約）與採購作業指引；經濟部計畫全額補助 241 組。"], "fu": [["TTC 是什麼？", "財團法人電信技術中心，負責無人機資安檢測。"], ["還做了什麼媒合？", "協調亞洲無人機 AI 創新應用研發中心邀通過檢測的廠商展示，113.3.25 辦縣市需求座談與功能展示。"]], "note": "", "updated": "115-10-20", "contact": "吳科員東穎", "must": "每月提供 TTC 通過名單；經濟部計畫全額補助 241 組"}, {"id": "Q25", "title": "110年底全面禁止各公務機關使用中國大陸製無人機後，有關大陸製無人機的後續處理情形及目前消防無人機之需求應用，本署之因應作為。", "group": "無人機・機器人・科技救災", "kw": "大陸製無人機, 禁陸, 非紅供應鏈, 資安", "one": "大陸製無人機已全面停用於公務，未到年限的僅供訓練，並以國產與非紅供應鏈補充。", "pts": ["依行政院 109.12.18 函，各機關 110 年底前汰換大陸廠牌資通訊產品。", "未達年限者只作飛手訓練、不執行救災；達年限依財產程序報廢。", "115–118 年補助購置 377 架，約 4億6,420萬元。", "工程會 115.1.7「遙控無人機採購作業指引」：限制陸港澳資廠商、零組件須國產與非紅。"], "fu": [["其他部會怎麼處理？", "林業及自然保育署等機關同樣改作訓練用、逾年限報廢。"], ["現有非大陸製無人機產地？", "主要為臺灣、法國、美國等。"]], "note": "", "updated": "115-10-20", "contact": "吳科員東穎", "must": "115–118 年補助 377 架、約 4億6,420萬元"}, {"id": "Q31", "title": "遙控無人機國外產品比較。", "group": "無人機・機器人・科技救災", "kw": "無人機比較, Skydio, 國外產品, X10", "one": "消防無人機主流是美國 Skydio，新一代 X10 更適合複雜的大範圍災害現場。", "pts": ["現有 420 架；114 年補助 59 組，115–118 年再補助 377 架，5 年共 436 組。", "X2：較早期、成熟穩定，重 1.3 公斤、續航 30 分鐘，適合一般火場偵查與搜救。", "X10：重 2.1 公斤、續航 40 分鐘，通訊、抗風、360 度避障更強，可夜間自主飛行。"], "fu": [["採購有什麼限制？", "工程會 115.1.7 採購指引要求國產化與非紅供應鏈，限制陸港澳資廠商與零組件。"]], "note": "", "updated": "115-10-20", "contact": "吳科員東穎", "must": "114–118 年共補助 436 組"}, {"id": "Q50", "title": "張智倫委員質詢臺北市政府消防局建議中央應建置無人機AI圖資辨識運算平台供全國消防機關使用辦理情形？", "group": "無人機・機器人・科技救災", "kw": "無人機AI, 圖資辨識, 張智倫, 搜救影像, Skydio", "one": "本署已建置無人機影像回傳與 AI 辨識系統，先用於山域搜救，火場 AI 仍需產官學合作提高成熟度。", "pts": ["114 年建置「無人機輔助搜救影像管理系統」：Skydio X10 空拍經 4G 回傳指揮中心，AI 辨識待救者。", "火場 AI 限制：各廠牌影像不相容、鐵皮反光誤判、角度與距離衰減、濃煙與玻璃阻擋。", "未來方向：全國影像集中累積本土資料，發展燃燒面積量測、火煙流判讀與人形特徵標示。", "無人機補助 114–118 年共 436 組。"], "fu": [["為什麼要本土影像？", "我國建築與山區樹種與國外不同，須累積本土災害影像，AI 才能準確判讀。"]], "note": "", "updated": "115-10-20", "contact": "吳科員東穎", "must": "114 年已建置無人機 AI 搜救影像系統，先用於山域"}, {"id": "Q19", "title": "救災機器人採購及預定採購期程。", "group": "無人機・機器人・科技救災", "kw": "救災機器人, 機器人採購", "one": "全國已有救災機器人 169 具，持續以中程計畫補助，目標每分隊 1 台。", "pts": ["現有 169 具，以高雄市 26 具最多。", "化學韌性計畫 115–118 年補助 28 組；高科技廠房計畫補助 37 組。", "功能：大流量射水、熱顯像、氣體偵測，可先深入火場壓制火勢、偵檢危害物質。"], "fu": [["過去用哪些計畫補助？", "精進消防救災裝備器材（105–108）、建構安全化學環境（109–113）、科技化無人載具協助計畫（113）、化學韌性與高科技廠房計畫（114–118）。"]], "note": "原檔未來補助數不一致：摘要寫 74 具與 65（28+37）具，說明寫 74（28+46）具；Q24 寫未來 4 年 65 具。被問總數時建議答「28 加 37 組」。", "updated": "115-10-20", "contact": "吳科員東穎", "must": "現有救災機器人 169 具"}, {"id": "Q45", "title": "政府將消防預算花費在高價卻不實用的消防機器人，卻沒錢幫消防員換裝備，是誰的責任?(張啟楷委員)", "group": "無人機・機器人・科技救災", "kw": "機器人, 張啟楷, 裝備經費, 無人載具, 消促會", "one": "機器人與個人裝備是兩筆分開的經費，兩者都在做，沒有排擠。", "pts": ["科技化無人載具計畫 6億6,000萬元：每縣市 3,000萬元，買無人機 4 組（單價 100萬元）、機器人 4 台（單價 650萬元）。", "22 縣市至 114.2.14 已全數採購完成並實際運用。", "個人裝備中程計畫 19億3,434萬5,100元，另行全額補助 14 種防護裝備、8 種器材。", "機器人可先進入資訊不明的危險火場偵測與射水，降低同仁風險。"], "fu": [["計畫怎麼來的？", "明揚大火後，行政院長指示中央投入經費，副院長 112.10.5 指示以特別統籌分配稅款全額協助。"], ["機器人適用哪些場景？", "化學工廠、長隧道、核生化、毒氣洩漏、高科技廠房、鐵皮屋或資源回收廠等危險火場。"]], "note": "", "updated": "115-10-20", "contact": "吳科員東穎", "must": "個人裝備 19億3,434萬5,100元與機器人計畫 6億6,000萬元是兩筆錢"}, {"id": "Q24", "title": "有關消防人員運用科技裝備器材救災議題。", "group": "無人機・機器人・科技救災", "kw": "科技裝備, 熱顯像儀, 科技救災, 中程計畫", "one": "以中程計畫全面導入無人機、機器人與熱顯像等科技裝備，降低同仁入室風險。", "pts": ["現有救災機器人 169 具、無人機 420 架，未來 4 年再補助無人機 377 架。", "化學韌性計畫約 41億元、高科技廠房計畫約 34億元、科技化無人載具計畫 6.6億元。", "個人裝備中程計畫約 19億元、經濟部無人載具計畫 3億6,150萬元。", "地方依地方制度法自行購置，中央以 23 項中程計畫、約 270億元協助。"], "fu": [["機器人能做什麼？", "大流量射水、熱顯像、氣體偵測，可先深入火場壓制火勢、偵檢危害物質。"], ["無人機能做什麼？", "提供即時空拍情資協助部署；紅外線機型可看出火場溫度分布，同仁進入前先研擬安全戰術。"]], "note": "本題寫 23 項中程計畫約 270億元，Q37 寫 24 項約 285億元。", "updated": "115-10-20", "contact": "吳科員東穎", "must": "現有機器人 169 具、無人機 420 架"}, {"id": "Q07", "title": "有關消防人員裝備的配置部分，目前是否確實提供每位消防人員有2套消防衣褲? (麥玉珍委員)", "group": "裝備・車輛", "kw": "消防衣, 2套, 個人裝備, 麥玉珍", "one": "外勤人員 2 套消防衣比例已達 99.8%，22 縣市都已規劃，21 縣市達標。", "pts": ["外勤 1萬4,669 人中，1萬4,639 人已配發 2 套（統計至 115.6.30）。", "21 個縣市已 100% 達標，各局另有備品可替換。", "個人裝備中程計畫（113–115 年）以特別統籌分配稅款 19億3,434萬5,100元 全額協助，含消防衣褲 4,142 組。"], "fu": [["裝備是誰該買？", "依地方制度法，救災裝備由地方編列採購；中央以中程計畫協助補助。"], ["衣服髒了怎麼辦？", "可調度備用衣褲，並補助消防衣專用洗衣機 104 台、烘衣機 39 台、風乾機 59 台；本署 108.12.2 訂有保養維護注意事項。"], ["這計畫還買了什麼？", "例如個人熱顯像儀 2,260 台、個人救命器 3,097 具、消防鞋 4,389 雙、頭盔耳罩組 12,234 組。"]], "note": "", "updated": "115-10-20", "contact": "余專員家均", "must": "2 套消防衣達 99.8%（1萬4,639／1萬4,669 人）"}, {"id": "Q23", "title": "竹市高樓火警2勇消殉職，管道間火警，燒出問題，雲梯車高度不足，如何進行救災？是否更精進消防員的裝備及以更科技化方式，提供消防員進入火場參考？說明消防搶救裝備補強情形。", "group": "裝備・車輛", "kw": "高樓火災, 管道間, 雲梯車, 晴空匯, 新竹", "one": "高樓火災以大樓本身消防設備為第一要務，消防同步以科技裝備與車輛補助強化搶救。", "pts": ["搶救以大樓自動撒水、連結送水管、排煙、緊急昇降機、特別安全梯與防災中心為主。", "全國雲梯車 231 輛（至 113.5.30），汰換車輛 2 期計畫再補助 21 輛、高科技廠房計畫 18 輛。", "化學韌性計畫（114–118 年）補助室內人員定位 43 組、熱顯像儀 622 個、數位式空氣呼吸器 3,741 組等，32億7,393萬元。", "運用熱顯像儀找火點、無人機空勘，降低入室風險。"], "fu": [["雲梯車為何不能救高樓？", "高樓水帶延伸費時、高處加壓送水不易，國內雲梯車多為 60 公尺以下；高樓首重建築本身設備。"], ["被動與主動防火誰管？", "被動防火（防火構造、區劃、避難設施）由工務依建築技術規則管；主動滅火（消防設備）由消防依設置標準管。"], ["自動撒水多有效？", "室溫達撒水頭動作值（一般攝氏 68 度）即自動放水，滅火成功率非常高。"]], "note": "高科技廠房計畫本題寫 118 輛、9,538 套、34億9,529萬7,000元，Q37 寫 125 輛、9,446 套、34億9,527萬9,000元。", "updated": "115-10-20", "contact": "張專員瀞文", "must": "高樓首重建築本身消防設備；全國雲梯車 231 輛"}, {"id": "Q30", "title": "共生面罩用途為何？是否是消防人員入室搜救的標配？消防人員提供共生面罩予民眾使用，對消防員本身是否會造成什麼風險？", "group": "裝備・車輛", "kw": "共生面罩, RIT, 入室搜救, 空氣呼吸器", "one": "共生面罩讓受困者共用消防員的氣瓶，已列為 RIT 必要裝備，但使用前必須先評估自身氣量。", "pts": ["以中壓管連接消防員空氣呼吸器，與受困者共享空氣。", "各消防機關已列為 RIT 入室必要裝備，納入日常訓練與搶救規範。", "風險：氣瓶使用時間減半、兩人連結移動受限、氣壓接近安全界限時的心理壓力。", "殘壓不足應請其他組支援或撤離，不可勉強共用。"], "fu": [["安全界限是多少？", "剩餘空氣接近 50–100 bar 時須依安全準則決策。"]], "note": "", "updated": "115-10-20", "contact": "余專員家均", "must": "已列 RIT 必要裝備；殘壓不足不可勉強共用"}, {"id": "Q37", "title": "消防員工作權益促進協會質疑消防人員裝備不足問題。 (消促會)", "group": "裝備・車輛", "kw": "裝備不足, 消促會, 中程計畫, 汰換消防車", "one": "中央推動 24 項中程計畫、約 285億元，協助地方汰換車輛、補充個人與科技裝備。", "pts": ["汰換老舊消防車：3 年計畫 110 輛（12億2,444萬5,000元）、2 期計畫 236 輛（19億3,650萬元）。", "個人裝備中程計畫（113–115 年）19億3,434萬5,100元。", "化學韌性計畫 32億7,393萬元；高科技廠房計畫 34億9,527萬9,000元。", "科技化無人載具計畫 6億6,000萬元，每縣市無人機 4 組、機器人 4 臺。"], "fu": [["裝備不是地方的責任嗎？", "依地方制度法由地方自購，中央以中程計畫協助。"], ["事件背景？", "新北烏來廣興橋救溺同仁殉職後，消促會提出基層裝備不足訴求。"]], "note": "Q24 寫 23 項約 270億元；高科技廠房計畫數字與 Q23 不同。", "updated": "115-10-20", "contact": "郭視察哲男、張專員瀞文、余專員家均、吳科員東穎", "must": "中央 24 項中程計畫、約 285億元協助地方"}, {"id": "Q52", "title": "廖先翔委員：有關消防車考量電動化的可行性，或引進國外新式消防車輛?", "group": "裝備・車輛", "kw": "電動消防車, 電動化, 廖先翔, 新式消防車", "one": "法規不限動力來源，電動消防車可行，但續航、充電、車重與維修是實務挑戰。", "pts": ["配置標準未限制動力來源，純電或油電車只要裝置符合規範即可採購。", "續航：重大災害動輒數小時，電量耗盡無法像燃油車現場補充。", "廳舍電力不足，須投資改善電力與充電樁；電池增加車重、壓縮水箱與裝備空間。", "維修高度依賴原廠，零件短缺會拉長停用時間。"], "fu": [["下一步？", "持續關注技術與應用案例，在確保救災效能前提下評估適合我國的車型，穩健推動綠能轉型。"]], "note": "", "updated": "115-10-20", "contact": "余專員家均", "must": "法規不限動力來源，可行但續航與充電是挑戰"}, {"id": "Q06", "title": "消防法第20條之1及第27條之1相關子法執行推動情形說明。", "group": "消防三權・救災安全・事故調查", "kw": "消防法20條之1, 27條之1, 退避權, 調查權, 調查會, 子法", "one": "退避權與調查權的子法都已訂定，並有每季紀錄與調查會機制落實。", "pts": ["退避權子法：「危險性救災行動認定標準」109.4.22 發布；外勤每季填紀錄表，由局內審核。", "退避權共 6 件：111 年 4 件、113 年 2 件。", "調查權子法：「災害事故調查會設置辦法」109.4.10 發布，114.6.1 全案修正施行。", "調查會已公布 5 份報告：喬友、屏東公墓、明揚、湖口住宅、新竹慈雲路（晴空匯）。"], "fu": [["退避後會不會被究責？", "法令規範主管機關不得事後對該搶救人員解僱、調職或其他不利處分。"], ["紀錄表記什麼？", "發生時間、案由、符合第幾款、研判理由、改採哪些搶救作為、指揮人員姓名。"]], "note": "本題寫調查權「5 案完成、2 案調查中」，Q15 寫 8 件、3 案調查中（多了 115.8.31 南投案），以 Q15 較新。", "updated": "115-10-20", "contact": "許視察涵舜", "must": "退避 6 件；調查會已公布 5 份報告"}, {"id": "Q15", "title": "消防法資訊權、退避權及調查權執行推動情形說明。", "group": "消防三權・救災安全・事故調查", "kw": "消防三權, 資訊權, 退避權, 調查權, 罰鍰", "one": "消防三權都已上路並有執行實績：退避 6 件、資訊權裁罰 4 件、調查 8 案。", "pts": ["退避權：111–115 上半年共 6 件（111 年 4 件、113 年 2 件）。", "資訊權：工廠違規裁罰 4 件，共 337萬元；明揚案未提供資訊罰 60萬元、未派專人罰 150萬元。", "調查權：110–115 年 8 案，5 案完成、3 案調查中（新店粗坑壩、基隆安樂、南投濁水溪）。"], "fu": [["被罰的是哪些工廠？", "桃園永成環科、桃園旭富藥廠、高雄聯成、屏東明揚。"], ["資訊權範圍有擴大嗎？", "已提高罰鍰上限，114.6.1 公告一定規模以上實驗室或倉庫也須提供資訊。"], ["「危險性救災行動認定標準」管什麼？", "明定適用對象、何謂無人命危害、危險行動範疇，以及退避時應改採的搶救作為，避免同仁依法退避反被究責。"]], "note": "", "updated": "115-10-20", "contact": "許視察涵舜", "must": "退避 6 件、資訊權裁罰 4 件 337萬元、調查 8 案"}, {"id": "Q39", "title": "消防人員退避權之說明。", "group": "消防三權・救災安全・事故調查", "kw": "退避權, 消防法第20條之1, 危險性救災行動", "one": "無人命危害時，同仁得不執行危險性救災行動，並明定哪些情況屬危險行動。", "pts": ["消防法第20條之1（108.11.13 增訂）。", "危險行動包括：核生化熱區、危險物品場所、輕鋼構與 PCB 廠、長隧道與地下建築、有倒塌之虞的建物等。", "遇閃燃前兆或倒塌等危急狀況可立即撤離並呼叫 Mayday。", "退避共 6 件：111 年 4 件、113 年 2 件。"], "fu": [["退避後要做什麼？", "改採其他適當搶救作為，並回報救災救護指揮中心。"], ["有哪 6 件？", "111 年湖口致佳科技、民雄工廠、彰化民宅、銅鑼輕鋼構；113 年彰化輕鋼架、新豐不明物質爆炸。"]], "note": "", "updated": "115-10-20", "contact": "許視察涵舜", "must": "無人命危害時得不執行危險行動；已退避 6 件"}, {"id": "Q41", "title": "落實消防三權（包括救災救護分流）情形?", "group": "消防三權・救災安全・事故調查", "kw": "消防三權, 救災救護分流, 資訊權罰則, 危害風險標示板", "one": "消防三權 108 年入法、113 年再強化；外勤全數完訓，並研究救災救護分流。", "pts": ["113.11.29 修法：資訊權擴及倉庫與實驗室、增訂危害風險標示板，調查權擴及其他勤務傷亡；114.6.1 施行。", "罰則：未派專人協助救災最高 1,000萬元；未提供化學品資訊最高 500萬元。", "外勤 13,789 人全數完成三權訓練（至 113.12.31）。", "分流研究結論：最大挑戰是人力短缺；提出 8 大模式、6 項方案供縣市試辦。"], "fu": [["危害風險標示板是什麼？", "工廠與化學品倉庫須在主要出入口揭露化學品危害，第一時間提醒消防；違者罰 2萬至150萬元。"], ["調查會多快啟動？", "死亡 2 日內、重傷或失能 5 日內。"], ["分流方案有哪些？", "局內獨立救護人員、約聘救護人員、現有人力分流、獨立救護機構、委外、派遣分級轉介。"]], "note": "宣導數字摘要寫 115 上半年 12,411 家、演練 1,094 次，說明寫至 114.12.31 為 3,748 家、886 次；報告發布日期也與 Q06 不同。", "updated": "115-10-20", "contact": "許視察涵舜", "must": "外勤 13,789 人全數完訓；未派專人最高罰 1,000萬元"}, {"id": "Q18", "title": "屏東明揚大火，內政部災害事故調查報告何時可完成，及如何具體落實?", "group": "消防三權・救災安全・事故調查", "kw": "明揚, 屏東大火, 調查報告, 災害事故調查會", "one": "明揚案調查報告已於 113.5.8 公布，改善建議由調查會持續追蹤。", "pts": ["112.9.23 啟動調查會，共開 4 次調查會議。", "現勘與 6 次訪談，累計訪談 33 人。", "報告 113.5.8 公布於內政部與本署網站；改善建議依消防法第27條之1追蹤落實。"], "fu": [["調查會由誰組成？", "依消防法第27條之1，聘請相關機關、團體代表、學者專家與基層消防團體代表組成。"]], "note": "Q41 寫明揚報告 113.5.10 發布，與本題 113.5.8 不同。", "updated": "115-10-20", "contact": "許視察涵舜", "must": "報告 113.5.8 已公布"}, {"id": "Q44", "title": "針對監察院調查晴空匯火災案所提意見之處理情形為何?", "group": "消防三權・救災安全・事故調查", "kw": "監察院, 晴空匯, 新竹慈雲路, 調查意見, 入室定位", "one": "調查報告已公布，並針對監察院意見推動勤安會、指揮安全訓練、通訊與入室定位等 6 項精進。", "pts": ["調查會 113.5.27 啟動，3 次會議、2 次現勘、5 次訪談，報告 115.2.11 公布。", "113 年成立勤安會，推動消防法增訂職安專章，配合訂定 6 項子法。", "114 年起補助 43 套入室定位系統（每套 600萬元），並強化無線電分流訓練。", "全面落實事故安全官制度，並以無人機偵察高樓火場。"], "fu": [["監察院指出什麼問題？", "疑似管道間配線短路致防火避難設施失效；新竹市消防局未全盤掌握入室管制，濃煙與結構造成無線電不良。"], ["勤安會是什麼？", "「警消勤務安全促進與事件調查會」，113 年 6 月成立，廣納各界意見保障警消安全。"]], "note": "", "updated": "115-10-20", "contact": "張專員瀞文", "must": "報告 115.2.11 公布；補助入室定位 43 套"}, {"id": "Q29", "title": "是否訂有消防員在火場的保命SOP?", "group": "消防三權・救災安全・事故調查", "kw": "保命SOP, MAYDAY, 受困, 迷失, LUNAR, RIT", "one": "有：受困時立即啟動 MAYDAY 並以 LUNAR 回報，三級以上火災必設安全官與 RIT 待命。", "pts": ["受困、迷失或氣源耗盡時呼叫 3 次 MAYDAY，並以 LUNAR 回報。", "進入有實體隔間的空間關門避難，開啟救命器並以燈光示位。", "低姿呼吸延長氣源；可移動時沿水線或導光索撤離。", "三級以上火災須指派安全官，並成立 RIT 待命入室救援。"], "fu": [["LUNAR 是什麼？", "受困時的回報口訣：位置（Location）、所屬單位（Unit）、姓名（Name）、原任務（Assignment）、剩餘空氣與所需支援（Resources）。"], ["RIT 是什麼？", "緊急救援小組，專門待命救援受困的消防人員。"], ["最高原則？", "先自保、再救人。"]], "note": "", "updated": "115-10-20", "contact": "張專員瀞文", "must": "MAYDAY＋LUNAR；三級以上火災必設安全官與 RIT"}, {"id": "Q40", "title": "從指揮官到一線同仁？(消促會)", "group": "消防三權・救災安全・事故調查", "kw": "救災安全訓練, 指揮官訓練, 事故安全官, 三層火場安全", "one": "從養成、指揮官、安全官到常年複訓，建立「保護自己才能保護他人」的安全文化。", "pts": ["三層安全管制：自我、小組、指揮。", "指揮官訓練：113 年 8 梯次 275 人次、114 年 10 梯次 262 人。", "事故安全官已訓練 463 人；114–118 年每年 4 梯次，預計 700 人。", "115 年起各級消防機關火場須納入事故安全官。"], "fu": [["事故安全官是什麼？", "在現場指揮系統中辨識與評估危害，並有權暫停或終止危險作業的角色。"], ["中央與地方怎麼分工？", "本署培育教官與指揮層級訓練；地方運用教官辦基礎、進階與分隊長以下幹部訓練。"]], "note": "安全官累計人數三處不同：本題 463 人、Q51 寫 283 人並預計達 1,003 人次。", "updated": "115-10-20", "contact": "張專員瀞文、喻科長宏祺", "must": "事故安全官已訓練 463 人，115 年起火場須納入"}, {"id": "Q09", "title": "美國消防隊員常在到達火場才完成著裝，先拉封鎖線，觀察火流、煙流，再決定如何部署勤務，但在臺灣若到場「沒有動作」，會被民眾罵翻，導致消防員壓力大、一定要在車上著裝。想問消防署對此是否有相關改善作為或構想？", "group": "消防三權・救災安全・事故調查", "kw": "著裝, 到場, 封鎖線, 火場指揮, 警戒區", "one": "分階段著裝兼顧時效與安全；到場後由指揮官觀察火場再部署，警戒交由警察執行。", "pts": ["出勤先穿消防衣褲鞋上車並繫安全帶，到場在安全處再穿戴消防帽、手套、空氣呼吸器。", "依「消防機關火場指揮及搶救作業要點」，救火指揮官觀察火流煙流後決定戰術、劃定警戒區。", "警戒指揮官負責警戒、交通管制與疏散，由警察分工執行。"], "fu": [["這套做法參考什麼？", "已參考美國 NFPA 1500 修訂「消防人員救災安全手冊」。"], ["民眾覺得消防到場沒動作？", "到場先觀察評估是為了安全與正確部署；本署持續透過搶救業務會報與地方溝通此原則。"]], "note": "", "updated": "115-10-20", "contact": "張專員瀞文", "must": "分階段著裝；到場先觀察再部署"}, {"id": "Q16", "title": "若消防員在救災時不具備建築結構的知識，過去是否有專業人士陪同救災的案例。", "group": "消防三權・救災安全・事故調查", "kw": "建築結構, 結構技師, 專業人士陪同, 明揚", "one": "有：各縣市特搜隊已納入結構技師，地方也有技師公會人力資料庫，災時可即時到場。", "pts": ["災害防救法第23條（111.6.15 修正）要求各級政府調查整備民間救災機具與專業人力並建資料庫。", "各縣市特種搜救隊均已納入結構技師，協助現場結構勘查。", "地方多已透過建築師、土木、結構技師公會建立專業人力資料庫。"], "fu": [["有實際案例嗎？", "112.9.7 臺北市大直鄰房傾斜案，建管處接獲消防局通報後，立即聯繫土木、結構、大地技師公會派員協助判斷疏散範圍。"]], "note": "", "updated": "115-10-20", "contact": "洪科長土容", "must": "各縣市特搜隊均已納入結構技師"}, {"id": "Q03", "title": "捕蜂捉蛇的執行單位是否已回歸到農政單位?", "group": "勤務・人力・回歸專業", "kw": "捕蜂捉蛇, 農政, 回歸專業, 1999, 動物救援", "one": "捕蜂捉蛇已由農政單位主政，全國只剩連江縣仍由消防局執行，本署持續追蹤。", "pts": ["行政院 105、106 年協調定案，自 106 年起由農政單位主政。", "19 縣市已委外廠商執行；南投縣捕蜂委外 }

function card(it, open, terms) {
  const nt = terms.map(norm).filter(Boolean);
  const fu = (it.fu || []).map(([q, a]) => {
    const hit = nt.length && nt.some(t => norm(q + a).includes(t));
    return `<details class="fq"${hit ? ' open' : ''}><summary><span>${hl(q, terms)}</span></summary><p>${hl(a, terms, true)}</p></details>`;
  }).join('');
  // QA 以外：勘誤、QA 外資料、答詢建議、時點提醒，各有標籤與色條
  const err = (S.errata[it.id] || []).map(e => `<p class="x err"><span class="tag">勘誤</span>
    <span>原檔寫「${hl(e['原檔'] || '', terms, true)}」，已更正為 ${hl(e['更正'] || '', terms, true)}</span>
    <span class="meta">${esc(e['依據'] || '')}${e['狀態'] ? '｜' + esc(e['狀態']) : ''}</span></p>`).join('');
  const TAG = { '成效': ['supp', 'QA 外｜成效'], '建議': ['adv', '建議'], '截點': ['adv', '時點提醒'] };
  const sup = (S.perq[it.id] || []).map(x => {
    const [cls, label] = TAG[x.type] || ['supp', 'QA 外｜' + x.type];
    const meta = [x.asof && (/^截至/.test(x.asof) ? '資料截至：' + x.asof.replace(/^截至\s*/, '') : x.asof), x.src && '來源：' + x.src].filter(Boolean).join('｜');
    return `<p class="x ${cls}"><span class="tag">${esc(label)}</span><span>${hl(x.text, terms, cls === 'supp')}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</p>`;
  }).join('');
  const rel = S.groups.filter(g => g.ids.includes(it.id)).map(g =>
    `<div class="rel">同題組「${esc(g.name)}」${g.mother && g.mother !== it.id ? `（母題 ${g.mother}）` : ''}：${qlinks(g.ids.filter(id => id !== it.id))}</div>`).join('');
  return `<details class="q"${open ? ' open' : ''}>
    <summary><span class="qid">${it.id}</span><span class="qt">${hl(it.title, terms)}</span></summary>
    <div class="ans">
      ${it.one ? `<p class="one">${hl(it.one, terms, true)}</p>` : ''}
      ${it.must ? `<p class="must"><b>必講</b><span>${hl(it.must, terms, true)}</span></p>` : ''}
      ${err}
      <ol>${it.pts.map(p => `<li><span>${hl(p, terms, true)}</span></li>`).join('')}</ol>
      ${fu ? `<div class="fu"><div class="fu-h">可能追問（點開看答法）</div>${fu}</div>` : ''}
      ${it.note ? `<p class="note"><b>口徑注意：</b>${hl(it.note, terms, true)}</p>` : ''}
      ${sup}
      ${rel}
      <div class="src"><span>依據：QA ${it.id}｜QA 版次 ${esc(it.updated)}</span><span>承辦：${esc(it.contact)}</span></div>
    </div>
  </details>`;
}

// 表格（計畫地圖、救護基本盤）在手機上改成一列一卡
function kvRows(tbl, nums) {
  if (!tbl) return '';
  const [k, ...rest] = tbl.head;
  return tbl.rows.map(r => `<div class="kv"><div class="k">${esc(r[0])}</div>` +
    rest.map((h, i) => {
      const v = r[i + 1] || '';
      return /來源|資料截至|題號|期程/.test(h)
        ? (/題號/.test(h) ? `<div class="rel">${qlinks(v.match(/Q\d+/g) || [])}</div>` : `<div class="meta">${esc(h)}：${esc(v)}</div>`)
        : `<div class="v">${hl(v, [], nums)}</div>`;
    }).join('') + '</div>').join('');
}

function renderRead() {
  const ax = S.axes.map(a => `<div class="ax"><h3>${esc(a.name)}</h3><p>${hl(a.say, [], true)}</p>` +
    (a.tip ? `<p class="tip">${esc(a.tip)}</p>` : '') +
    `<div class="rel">${qlinks(a.ids)}<button type="button" class="ql" data-ids="${a.ids.join(',')}" data-label="${esc(a.name)}">全部展開</button></div></div>`).join('');
  return `<div class="ver-box">QA 內容：QA 版次 <b>${esc(m.updated)}</b>（收檔 ${esc(m.received)}）<br>
      補充資料：最後整理 <b>${esc(S.updated)}</b>，各項另標資料截點<br>
      顏色：<span class="tag" style="background:var(--supp)">QA 外</span> QA 以外資料　<span class="tag" style="background:var(--adv)">建議</span> 答詢提醒　<span class="tag" style="background:var(--err)">勘誤</span> 已更正原檔錯誤</div>
    <section class="sec qa"><h2>論述主軸 <span class="tag">QA 整理</span></h2>
      <p class="lead">多數題目可歸到這幾條主軸；遇到沒準備的題目，先講主軸，再補數字。</p>${ax}</section>
    ${S.base ? `<section class="sec supp"><h2>救護基本盤 <span class="tag">QA 外</span></h2>
      <p class="lead">QA 沒有的全國救護基本數字。每列都標了資料截點，引用時要一起講。</p>${kvRows(S.base, true)}</section>` : ''}
    ${S.plans ? `<section class="sec qa"><h2>計畫地圖 <span class="tag">QA 整理</span></h2>
      <p class="lead">計畫名稱相近，最容易講混。經費照 QA 寫法；QA 前後寫法不同的已並列。</p>${kvRows(S.plans, true)}</section>` : ''}
    ${S.terms.length ? `<section class="sec qa"><details><summary>名詞速查（${S.terms.length} 個）</summary>
      ${S.terms.map(([t, d]) => `<div class="kv"><div class="k">${esc(t)}</div><div class="v">${hl(d, [], false)}</div></div>`).join('')}</details></section>` : ''}`;
}

function renderWho() {
  return `<section class="sec"><h2>依提問委員／團體</h2><p class="lead">從題目文字自動抓出，QA 換版會跟著更新。</p><div class="who">` +
    DATA.who.map(([n, ids]) => `<div class="who-row"><b>${esc(n)}</b>${qlinks(ids)}</div>`).join('') + '</div></section>';
}

function render() {
  const raw = $('#q').value.trim();
  $('#clear').hidden = !raw;
  chips.querySelectorAll('.chip').forEach(b =>
    b.setAttribute('aria-pressed', String(!raw && (mode === b.textContent || (mode === 'ids' && idsView && idsView.from === b.textContent)))));
  const list = $('#list');
  if (raw) {
    const terms = raw.split(/\s+/);
    const nt = terms.map(norm).filter(Boolean);
    const hits = items.filter(it => nt.every(t => it.hay.includes(t)))
      .map(it => ({ it, s: nt.reduce((s, t) => s + (it.hayTitle.includes(t) ? 2 : 0) + (it.hayKw.includes(t) ? 1 : 0), 0) }))
      .sort((a, b) => b.s - a.s).map(x => x.it);
    const defs = S.terms.filter(([t]) => nt.some(x => norm(t).includes(x)));
    list.innerHTML = defs.map(([t, d]) => `<p class="x term"><span class="tag">名詞｜QA 整理</span><span><b>${hl(t, terms)}</b>：${hl(d, terms)}</span></p>`).join('') + (hits.length
      ? `<div class="status">找到 ${hits.length} 題</div>` + hits.map((it, i) => card(it, i < 3, terms)).join('')
      : `<div class="empty"><b>QA 沒有這題。</b><br>換個說法再試，例如用簡短的名詞；或請 Claude 從 KM 查。</div>`);
    return;
  }
  if (mode === '先讀') { list.innerHTML = renderRead(); return; }
  if (mode === '委員') { list.innerHTML = renderWho(); return; }
  if (mode === 'ids' && idsView) {
    list.innerHTML = `<button type="button" class="chip back" data-back>← 返回</button><div class="group-h">${esc(idsView.label)}</div>` +
      idsView.ids.filter(id => byId[id]).map(id => card(byId[id], true, [])).join('');
    return;
  }
  const gs = DATA.groups.includes(mode) ? [mode] : DATA.groups;
  list.innerHTML = gs.map(g => `<div class="group-h">${esc(g)}</div>` +
    items.filter(it => it.group === g).map(it => card(it, gs.length === 1, [])).join('')).join('');
}

let t;
$('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 120); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#clear').onclick = () => { $('#q').value = ''; render(); $('#q').focus(); };

const steps = [0.9, 1, 1.1, 1.2, 1.35, 1.5];
let si = steps.indexOf(Number(store.get('qa-scale'))); if (si < 0) si = 2;
function applyScale() { document.documentElement.style.setProperty('--scale', steps[si]); store.set('qa-scale', String(steps[si])); }
$('#smaller').onclick = () => { si = Math.max(0, si - 1); applyScale(); };
$('#bigger').onclick = () => { si = Math.min(steps.length - 1, si + 1); applyScale(); };
applyScale();
render();
</script>
</body>
</html>
